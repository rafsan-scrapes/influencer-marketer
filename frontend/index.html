<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Influencer Marketer</title>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="app" class="min-h-screen flex flex-col">
      <!-- Login Page -->
      <div id="login-page" class="hidden min-h-screen flex items-center justify-center bg-slate-50 px-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-slate-200 p-8">
          <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Influencer Marketer</h1>
            <p class="text-slate-500 mt-1">Sign in to your account</p>
          </div>
          
          <div id="auth-error" class="hidden mb-4 p-3 rounded bg-red-50 text-red-700 text-sm" role="alert"></div>
          
          <form id="login-form" class="space-y-4" autocomplete="off">
            <div>
              <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
              <input type="email" id="login-email" required autocomplete="email" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" placeholder="you@example.com" />
            </div>
            <div>
              <label for="login-password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
              <input type="password" id="login-password" required autocomplete="current-password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" placeholder="••••••••" />
            </div>
            <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500/20 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
              Sign In
            </button>
          </form>
          
          <p class="mt-6 text-center text-sm text-slate-600">
            Don't have an account?
            <button id="show-signup" type="button" class="text-indigo-600 hover:text-indigo-700 font-medium">Sign up</button>
          </p>
        </div>
      </div>

      <div id="signup-page" class="hidden min-h-screen flex items-center justify-center bg-slate-50 px-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-slate-200 p-8">
          <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Influencer Marketer</h1>
            <p class="text-slate-500 mt-1">Create your account</p>
          </div>
          
          <div id="signup-error" class="hidden mb-4 p-3 rounded bg-red-50 text-red-700 text-sm" role="alert"></div>
          
          <form id="signup-form" class="space-y-4" autocomplete="off">
            <div>
              <label for="signup-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
              <input type="email" id="signup-email" required autocomplete="email" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" placeholder="you@example.com" />
            </div>
            <div>
              <label for="signup-password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
              <input type="password" id="signup-password" required minlength="8" autocomplete="new-password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" placeholder="At least 8 characters" />
            </div>
            <div>
              <label for="signup-confirm" class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
              <input type="password" id="signup-confirm" required autocomplete="new-password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" placeholder="••••••••" />
            </div>
            <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500/20 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
              Create Account
            </button>
          </form>
          
          <p class="mt-6 text-center text-sm text-slate-600">
            Already have an account?
            <button id="show-login" type="button" class="text-indigo-600 hover:text-indigo-700 font-medium">Sign in</button>
          </p>
        </div>
      </div>

      <!-- Authenticated App Shell -->
      <div id="app-shell" class="hidden flex flex-col min-h-screen">
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
          <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
              <div class="flex items-center gap-4">
                <a href="#" class="text-xl font-bold text-slate-900" data-tab="projects">Influencer Marketer</a>
                
                <!-- Project Switcher -->
                <div id="project-switcher" class="hidden ml-4 relative">
                  <button id="project-switcher-btn" type="button" class="flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:ring-2 focus:ring-indigo-500/20 focus:ring-offset-2" aria-expanded="false" aria-haspopup="true">
                    <span id="current-project-name" class="truncate max-w-[200px]">Select project</span>
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                  </button>
                  <div id="project-dropdown" class="hidden absolute right-0 mt-1 w-56 rounded-lg border border-slate-200 bg-white shadow-lg py-1 z-50">
                    <div id="project-list" class="max-h-60 overflow-auto"></div>
                    <hr class="my-1 border-slate-200" />
                    <button id="new-project-btn" class="w-full text-left px-3 py-2 text-sm text-indigo-600 hover:bg-slate-50">+ New Project</button>
                    <button id="manage-projects-btn" class="w-full text-left px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">Manage Projects</button>
                  </div>
                </div>
              </div>
              
              <div class="flex items-center gap-3">
                <!-- User Menu -->
                <div class="relative">
                  <button id="user-menu-btn" type="button" class="flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-50 focus:ring-2 focus:ring-indigo-500/20" aria-expanded="false" aria-haspopup="true">
                    <span id="user-email" class="hidden sm:block truncate max-w-[160px]"></span>
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                  </button>
                  <div id="user-dropdown" class="hidden absolute right-0 mt-1 w-40 rounded-lg border border-slate-200 bg-white shadow-lg py-1 z-50">
                    <button id="settings-btn" class="w-full text-left px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">Settings</button>
                    <button id="logout-btn" class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-slate-50">Logout</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 mx-auto max-w-7xl w-full px-4 sm:px-6 lg:px-8 py-6">
          <div id="app-content">
            <!-- Dynamic content rendered by tabs -->
          </div>
        </main>
      </div>

      <!-- New Project Modal -->
      <div id="new-project-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="new-project-title">
        <div class="flex min-h-full items-center justify-center p-4">
          <div class="fixed inset-0 bg-black/50 transition-opacity" aria-hidden="true"></div>
          <div class="relative w-full max-w-md bg-white rounded-xl shadow-xl border border-slate-200 p-6">
            <h2 id="new-project-title" class="text-lg font-semibold text-slate-900 mb-4">New Project</h2>
            <form id="new-project-form" class="space-y-4">
              <div>
                <label for="new-project-name" class="block text-sm font-medium text-slate-700 mb-1">Project Name</label>
                <input type="text" id="new-project-name" required maxlength="255" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" placeholder="My Campaign" />
              </div>
              <div class="flex justify-end gap-3 pt-2">
                <button type="button" id="new-project-cancel" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Create</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Manage Projects Modal -->
      <div id="manage-projects-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="manage-projects-title">
        <div class="flex min-h-full items-center justify-center p-4">
          <div class="fixed inset-0 bg-black/50" aria-hidden="true"></div>
          <div class="relative w-full max-w-2xl bg-white rounded-xl shadow-xl border border-slate-200 p-6 max-h-[80vh] overflow-auto">
            <div class="flex items-center justify-between mb-4">
              <h2 id="manage-projects-title" class="text-lg font-semibold text-slate-900">Manage Projects</h2>
              <button id="manage-projects-close" class="text-slate-400 hover:text-slate-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <div id="manage-projects-list" class="space-y-2"></div>
            <div class="mt-4 pt-4 border-t border-slate-200">
              <button id="manage-projects-new" class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">+ New Project</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Confirm Delete Modal -->
      <div id="confirm-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <div class="flex min-h-full items-center justify-center p-4">
          <div class="fixed inset-0 bg-black/50" aria-hidden="true"></div>
          <div class="relative w-full max-w-md bg-white rounded-xl shadow-xl border border-slate-200 p-6">
            <h3 id="confirm-title" class="text-lg font-semibold text-slate-900 mb-2"></h3>
            <p id="confirm-message" class="text-slate-600 text-sm mb-6"></p>
            <div class="flex justify-end gap-3">
              <button id="confirm-cancel" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
              <button id="confirm-ok" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Delete</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Toast Container -->
      <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2" role="region" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
